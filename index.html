<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interactive Graffiti Wall - Multiplayer</title>

  <!-- Mobile Fullscreen App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121110">
  <meta name="apple-mobile-web-app-title" content="Graffiti Wall">
  <meta name="application-name" content="Graffiti Wall">

  <!-- Custom App Icon Links -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  
  <!-- Web Application Manifest for Android Chrome -->
  <link rel="manifest" href="manifest.json">

  <!-- PeerJS for P2P Multiplayer & MQTT.js for Server Discovery -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121110;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
      user-select: none;
      color: #fff;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(18, 17, 16, 0.95);
      backdrop-filter: blur(8px);
    }

    .screen.active {
      display: flex;
    }

    /* Main Menu Styling */
    .menu-container {
      text-align: center;
      max-width: 450px;
      width: 90%;
      padding: 40px 30px;
      background: #1a1817;
      border: 2px solid #333;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }

    .menu-title {
      font-size: 32px;
      font-weight: bold;
      color: #39ff14;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
      letter-spacing: 2px;
    }

    .menu-subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    .menu-btn {
      width: 100%;
      background: #262423;
      color: #fff;
      border: 2px solid #555;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      background: #39ff14;
      border-color: #39ff14;
      color: #121110;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
      transform: translateY(-2px);
    }

    .menu-btn.secondary:hover {
      background: #00f0ff;
      border-color: #00f0ff;
      color: #121110;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }

    .menu-btn.saves-btn:hover {
      background: #ffae00;
      border-color: #ffae00;
      color: #121110;
      box-shadow: 0 0 15px rgba(255, 174, 0, 0.6);
    }

    /* Server Browser & Saves Gallery Screens */
    .lobby-container {
      width: 90%;
      max-width: 750px;
      height: 85%;
      background: #1a1817;
      border: 2px solid #333;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      position: relative;
    }

    .lobby-header {
      padding: 20px 25px;
      background: #221f1e;
      border-bottom: 2px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lobby-title {
      font-size: 20px;
      font-weight: bold;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .server-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Saves Gallery Grid */
    .saves-grid {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      align-content: start;
    }

    .save-card {
      background: #262423;
      border: 1px solid #444;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .save-card:hover {
      border-color: #39ff14;
      transform: translateY(-3px);
    }

    .save-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .save-info {
      padding: 10px 12px;
      font-size: 11px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .save-actions {
      display: flex;
      border-top: 1px solid #333;
    }

    .save-btn-action {
      flex: 1;
      background: #262423;
      color: #fff;
      border: none;
      padding: 8px 0;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.15s ease;
    }

    .save-btn-action:first-child {
      border-right: 1px solid #333;
    }

    .save-btn-action:hover {
      background: #39ff14;
      color: #121110;
    }

    .save-btn-action.delete:hover {
      background: #ff3b30;
      color: #fff;
    }

    .server-card {
      background: #262423;
      border: 1px solid #444;
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .server-card:hover {
      border-color: #00f0ff;
      background: #2e2c2b;
    }

    .server-info h4 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 4px;
    }

    .server-info p {
      font-size: 12px;
      color: #aaa;
    }

    .server-join-btn {
      background: #39ff14;
      color: #121110;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 12px;
      transition: transform 0.1s ease;
    }

    .server-join-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }

    .no-servers {
      text-align: center;
      color: #777;
      margin-top: 50px;
      font-style: italic;
      grid-column: 1 / -1;
    }

    .lobby-footer {
      padding: 15px 25px;
      background: #221f1e;
      border-top: 2px solid #333;
      display: flex;
      gap: 10px;
    }

    /* Modals & Dialogs */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #1a1817;
      border: 2px solid #444;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-control {
      width: 100%;
      background: #262423;
      border: 1px solid #555;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: #39ff14;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 5px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    /* Game Canvases & UI */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #bgCanvas { z-index: 0; }
    #wallCanvas { z-index: 1; filter: drop-shadow(0px 0px 3px rgba(0, 0, 0, 0.5)); }
    #canCanvas { z-index: 2; pointer-events: none; }

    .ui-bar {
      position: absolute;
      bottom: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 17, 16, 0.92);
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid #333;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      flex-wrap: wrap;
      justify-content: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .ui-bar.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px);
    }

    .color-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .color-btn.active {
      transform: scale(1.25);
      box-shadow: 0 0 12px currentColor;
    }

    .color-wheel-wrapper {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-wheel-wrapper.active {
      transform: scale(1.25);
      box-shadow: 0 0 12px #fff;
    }

    .color-wheel-wrapper input[type="color"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .color-wheel-inner {
      width: 18px; height: 18px; border-radius: 50%;
      background: #39ff14; border: 1.5px solid #fff; pointer-events: none;
    }

    .tool-btn {
      background: #262423;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover { background: #444; border-color: #888; }
    .tool-btn.active-tool { background: #39ff14; border-color: #39ff14; color: #121110; box-shadow: 0 0 12px rgba(57, 255, 20, 0.6); }
    .tool-btn.active-eraser { background: #ff6b81; border-color: #ff4757; color: #fff; box-shadow: 0 0 12px rgba(255, 71, 87, 0.6); }
    .save-btn:hover { background: #00f0ff; border-color: #00f0ff; color: #121110; }
    .clear-btn:hover { background: #ff3b30; border-color: #ff3b30; color: #fff; }
    .leave-btn:hover { background: #ffaa00; border-color: #ffaa00; color: #121110; }

    .show-ui-btn {
      position: absolute;
      bottom: 20px; right: 20px; z-index: 10;
      background: rgba(18, 17, 16, 0.75); color: #fff;
      border: 1px solid #555; padding: 8px 16px; border-radius: 20px;
      font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase;
      letter-spacing: 1px; backdrop-filter: blur(4px); opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, background 0.2s ease;
    }
    .show-ui-btn.visible { opacity: 1; pointer-events: auto; }
    .show-ui-btn:hover { background: #444; border-color: #fff; }

    /* Connection Status Badge */
    .connection-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(18, 17, 16, 0.85);
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }
    .connection-badge.active { display: flex; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #39ff14; box-shadow: 0 0 8px #39ff14; }
  </style>
</head>
<body>

  <!-- 1. MAIN MENU SCREEN -->
  <div id="mainMenuScreen" class="screen active">
    <div class="menu-container">
      <div class="menu-title">GRAFFITI WALL</div>
      <div class="menu-subtitle">Urban Spray Simulator</div>
      <button class="menu-btn" onclick="startSinglePlayer()">Single Player</button>
      <button class="menu-btn secondary" onclick="openServerBrowser()">Multiplayer</button>
      <button class="menu-btn saves-btn" onclick="openSavesGallery()">Saves</button>
    </div>
  </div>

  <!-- 2. SERVER BROWSER SCREEN -->
  <div id="serverBrowserScreen" class="screen">
    <div class="lobby-container">
      <div class="lobby-header">
        <div class="lobby-title">Server Browser</div>
        <button class="tool-btn" onclick="backToMainMenu()">Main Menu</button>
      </div>
      <div id="serverListContainer" class="server-list">
        <div class="no-servers">Searching for public servers...</div>
      </div>
      <div class="lobby-footer">
        <button class="menu-btn" style="margin-bottom:0;" onclick="openCreateServerModal()">Create Server</button>
        <button class="tool-btn" onclick="refreshServers()" style="padding: 0 20px;">Refresh</button>
      </div>
    </div>
  </div>

  <!-- 3. SAVES GALLERY SCREEN -->
  <div id="savesScreen" class="screen">
    <div class="lobby-container">
      <div class="lobby-header">
        <div class="lobby-title">Saved Artworks</div>
        <button class="tool-btn" onclick="backToMainMenuFromSaves()">Main Menu</button>
      </div>
      <div id="savesGridContainer" class="saves-grid">
        <!-- Dynamically filled with user's saves -->
      </div>
    </div>
  </div>

  <!-- CREATE SERVER MODAL -->
  <div id="createServerModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Create New Server</div>
      <div class="form-group">
        <label>Server Name</label>
        <input type="text" id="inputServerName" class="form-control" value="Graffiti Room" maxlength="25">
      </div>
      <div class="form-group">
        <label>Visibility</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="serverType" value="public" checked onchange="toggleServerType('public')"> Public</label>
          <label class="radio-label"><input type="radio" name="serverType" value="private" onchange="toggleServerType('private')"> Private</label>
        </div>
      </div>
      <div class="form-group" id="publicOptionsGroup">
        <label>Max Players</label>
        <input type="number" id="inputMaxPlayers" class="form-control" value="4" min="2" max="10">
      </div>
      <div class="form-group" id="privateOptionsGroup" style="display: none;">
        <label>Join Code</label>
        <input type="text" id="inputRoomCode" class="form-control" placeholder="e.g. 1234" maxlength="6">
      </div>
      <div class="modal-buttons">
        <button class="menu-btn" style="margin-bottom:0;" onclick="createServer()">Launch</button>
        <button class="tool-btn" onclick="closeCreateServerModal()" style="flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <!-- PRIVATE ROOM CODE PROMPT MODAL -->
  <div id="passwordModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Enter Private Room Code</div>
      <div class="form-group">
        <label>Code Required</label>
        <input type="text" id="inputJoinCode" class="form-control" placeholder="Enter code..." maxlength="6">
      </div>
      <div class="modal-buttons">
        <button class="menu-btn" style="margin-bottom:0;" onclick="submitRoomCode()">Join</button>
        <button class="tool-btn" onclick="closePasswordModal()" style="flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <!-- CONNECTION STATUS BADGE IN GAME -->
  <div id="connectionBadge" class="connection-badge">
    <div class="status-dot"></div>
    <span id="badgeText">Multiplayer (1/4)</span>
  </div>

  <!-- GAME CANVASES & CONTROLS -->
  <canvas id="bgCanvas"></canvas>
  <canvas id="wallCanvas"></canvas>
  <canvas id="canCanvas"></canvas>

  <div id="uiBar" class="ui-bar">
    <div class="color-btn active" style="background: #39ff14; color: #39ff14;" onclick="setColor('#39ff14', '57, 255, 20', this)"></div>
    <div class="color-btn" style="background: #ff007f; color: #ff007f;" onclick="setColor('#ff007f', '255, 0, 127', this)"></div>
    <div class="color-btn" style="background: #00f0ff; color: #00f0ff;" onclick="setColor('#00f0ff', '0, 240, 255', this)"></div>
    <div class="color-btn" style="background: #ffae00; color: #ffae00;" onclick="setColor('#ffae00', '255, 174, 0', this)"></div>
    <div class="color-btn" style="background: #ffffff; color: #ffffff;" onclick="setColor('#ffffff', '255, 255, 255', this)"></div>
    <div class="color-btn" style="background: #111111; color: #888888; border-color: #777;" onclick="setColor('#111111', '17, 17, 17', this)"></div>

    <div id="customColorWrapper" class="color-wheel-wrapper" title="Pick Custom Color">
      <div id="colorWheelInner" class="color-wheel-inner"></div>
      <input type="color" id="customColorInput" value="#39ff14" oninput="handleCustomColor(this.value)">
    </div>
    
    <button id="sizeFine" class="tool-btn" onclick="setSprayRadius(12, this)">Fine</button>
    <button id="sizeStd" class="tool-btn active-tool" onclick="setSprayRadius(22, this)">Std</button>
    <button id="sizeWide" class="tool-btn" onclick="setSprayRadius(36, this)">Wide</button>

    <button id="eraserBtn" class="tool-btn" onclick="setEraser()">Eraser</button>
    <button class="tool-btn save-btn" onclick="saveWall()">Save Art</button>
    <button class="tool-btn clear-btn" onclick="clearWall()">Clear Wall</button>
    <button class="tool-btn leave-btn" onclick="exitToMenu()">Main Menu</button>
    <button id="leaveBtn" class="tool-btn leave-btn" onclick="leaveGame()" style="display:none;">Leave Room</button>
    <button class="tool-btn" onclick="toggleUI(false)">Hide UI</button>
  </div>

  <button id="showUiBtn" class="show-ui-btn" onclick="toggleUI(true)">Show Controls</button>

  <script>
    // --- APP & MULTIPLAYER STATE ---
    let gameMode = 'single'; // 'single', 'host', 'client'
    let peer = null;
    let mqttClient = null;
    let hostConnection = null;
    let clientConnections = [];
    let discoveredServers = {};
    let selectedServerToJoin = null;
    let hostRoomCode = '';
    let isPrivateServer = false;

    const MQTT_TOPIC_DISCOVERY = 'graffiti_wall_servers_v1';
    const MQTT_BROKER_URL = 'wss://broker.hivemq.com:8884/mqtt';

    // --- CANVAS SETUP ---
    const bgCanvas = document.getElementById('bgCanvas');
    const wallCanvas = document.getElementById('wallCanvas');
    const canCanvas = document.getElementById('canCanvas');
    
    const bgCtx = bgCanvas.getContext('2d');
    const wallCtx = wallCanvas.getContext('2d');
    const canCtx = canCanvas.getContext('2d');

    let width, height;
    let drips = [];

    let currentTool = 'spray';
    let currentColorHex = '#39ff14';
    let currentColorRGB = '57, 255, 20';
    let sprayRadius = 22;
    const ERASER_RADIUS = 35;

    let isSpraying = false;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let lastX = mouseX;
    let lastY = mouseY;
    let lastSprayX = mouseX;
    let lastSprayY = mouseY;
    let shakeAngle = 0;

    // --- AUDIO SYSTEM ---
    let audioCtx = null;
    let sprayNode = null;
    let sprayGain = null;
    let shakeCooldown = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        setupSprayAudio();
      }
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    }

    function setupSprayAudio() {
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

      sprayNode = audioCtx.createBufferSource();
      sprayNode.buffer = noiseBuffer;
      sprayNode.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 3200;
      filter.Q.value = 1.2;

      sprayGain = audioCtx.createGain();
      sprayGain.gain.setValueAtTime(0, audioCtx.currentTime);

      sprayNode.connect(filter);
      filter.connect(sprayGain);
      sprayGain.connect(audioCtx.destination);
      sprayNode.start();
    }

    function startSpraySound() {
      initAudio();
      if (sprayGain && currentTool === 'spray') {
        sprayGain.gain.setTargetAtTime(0.18, audioCtx.currentTime, 0.03);
      }
    }

    function stopSpraySound() {
      if (sprayGain) { sprayGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03); }
    }

    function playShakeSound() {
      initAudio();
      if (!audioCtx || Date.now() - shakeCooldown < 120) return;
      shakeCooldown = Date.now();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(450 + Math.random() * 200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playClickSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      bgCanvas.width = width;
      bgCanvas.height = height;
      wallCanvas.width = width;
      wallCanvas.height = height;
      canCanvas.width = width;
      canCanvas.height = height;

    function drawRealisticBricks() {
      bgCtx.clearRect(0, 0, width, height);
      bgCtx.fillStyle = '#262423';
      bgCtx.fillRect(0, 0, width, height);

      const brickW = 110;
      const brickH = 48;
      const gap = 5;
      const rows = Math.ceil(height / (brickH + gap)) + 1;
      const cols = Math.ceil(width / (brickW + gap)) + 1;

      for (let r = 0; r < rows; r++) {
        const offsetX = (r % 2 === 0) ? 0 : -(brickW / 2);
        for (let c = 0; c < cols; c++) {
          const x = c * (brickW + gap) + offsetX;
          const y = r * (brickH + gap);

          const rCol = 65 + Math.floor(Math.random() * 35);
          const gCol = 32 + Math.floor(Math.random() * 18);
          const bCol = 25 + Math.floor(Math.random() * 15);

          bgCtx.fillStyle = `rgb(${rCol}, ${gCol}, ${bCol})`;
          bgCtx.fillRect(x, y, brickW, brickH);
          bgCtx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          bgCtx.fillRect(x, y, brickW, 3);
          bgCtx.fillRect(x, y, 3, brickH);
          bgCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          bgCtx.fillRect(x, y + brickH - 4, brickW, 4);
          bgCtx.fillRect(x + brickW - 4, y, 4, brickH);

          for (let i = 0; i < 12; i++) {
            const gx = x + Math.random() * brickW;
            const gy = y + Math.random() * brickH;
            bgCtx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.06)';
            bgCtx.fillRect(gx, gy, 2, 2);
          }
        }
      }

      const grad = bgCtx.createRadialGradient(width/2, height/2, height*0.2, width/2, height/2, width*0.7);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      grad.addColorStop(1, 'rgba(8, 8, 8, 0.75)');
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0, 0, width, height);
    }

    // --- LOCAL STORAGE SAVES SYSTEM ---
    function getSavedArtworks() {
      const saves = localStorage.getItem('graffiti_saved_artworks');
      return saves ? JSON.parse(saves) : [];
    }

    function saveWall() {
      playClickSound();
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = width;
      exportCanvas.height = height;
      const exportCtx = exportCanvas.getContext('2d');
      exportCtx.drawImage(bgCanvas, 0, 0);
      exportCtx.drawImage(wallCanvas, 0, 0);
      
      const dataURL = exportCanvas.toDataURL('image/png');
      const saves = getSavedArtworks();
      const newSave = {
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        data: dataURL
      };
      
      saves.unshift(newSave);
      try {
        localStorage.setItem('graffiti_saved_artworks', JSON.stringify(saves));
        alert('Artwork saved to your Saves Gallery!');
      } catch (e) {
        alert('Storage limit reached! Please delete some old saves from the main menu gallery.');
      }
    }

    function renderSavesGallery() {
      const container = document.getElementById('savesGridContainer');
      const saves = getSavedArtworks();

      if (saves.length === 0) {
        container.innerHTML = '<div class="no-servers">No saved artworks yet. Paint something and click "Save Art"!</div>';
        return;
      }

      container.innerHTML = '';
      saves.forEach(item => {
        const card = document.createElement('div');
        card.className = 'save-card';
        card.innerHTML = `
          <img src="${item.data}" alt="Saved Graffiti Art">
          <div class="save-info">
            <span>Graffiti Art</span>
            <span>${item.date}</span>
          </div>
          <div class="save-actions">
            <button class="save-btn-action" onclick="downloadSavedArt('${item.id}')">⬇ Download</button>
            <button class="save-btn-action delete" onclick="deleteSavedArt('${item.id}')">🗑 Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function downloadSavedArt(id) {
      playClickSound();
      const saves = getSavedArtworks();
      const art = saves.find(s => String(s.id) === String(id));
      if (art) {
        const link = document.createElement('a');
        link.download = `graffiti-art-${id}.png`;
        link.href = art.data;
        link.click();
      }
    }

    function deleteSavedArt(id) {
      playClickSound();
      if (!confirm('Delete this artwork?')) return;
      let saves = getSavedArtworks();
      saves = saves.filter(s => String(s.id) !== String(id));
      localStorage.setItem('graffiti_saved_artworks', JSON.stringify(saves));
      renderSavesGallery();
    }

    function initMqttDiscovery() {
      if (mqttClient) return;
      try {
        mqttClient = mqtt.connect(MQTT_BROKER_URL);
        mqttClient.on('connect', () => {
          mqttClient.subscribe(MQTT_TOPIC_DISCOVERY);
        });
        mqttClient.on('message', (topic, payload) => {
          if (topic === MQTT_TOPIC_DISCOVERY) {
            try {
              const data = JSON.parse(payload.toString());
              if (data.id && data.name) {
                discoveredServers[data.id] = { ...data, lastSeen: Date.now() };
                renderServerList();
              }
            } catch(e) {}
          }
        });
      } catch(e) {
        console.error('MQTT error', e);
      }
    }

    function refreshServers() {
      playClickSound();
      const container = document.getElementById('serverListContainer');
      container.innerHTML = '<div class="no-servers">Searching for public servers...</div>';
      
      const now = Date.now();
      Object.keys(discoveredServers).forEach(id => {
        if (now - discoveredServers[id].lastSeen > 10000) {
          delete discoveredServers[id];
        }
      });
      renderServerList();
    }

    function renderServerList() {
      const container = document.getElementById('serverListContainer');
      const serverIds = Object.keys(discoveredServers);
      
      if (serverIds.length === 0) {
        container.innerHTML = '<div class="no-servers">No active servers found. Click "Create Server" to start one!</div>';
        return;
      }

      container.innerHTML = '';
      serverIds.forEach(id => {
        const s = discoveredServers[id];
        const card = document.createElement('div');
        card.className = 'server-card';
        card.innerHTML = `
          <div class="server-info">
            <h4>${s.name} ${s.isPrivate ? '🔒' : ''}</h4>
            <p>Players: ${s.players || 1}/${s.maxPlayers || 4}</p>
          </div>
          <button class="server-join-btn" onclick="tryJoinServer('${id}')">Join</button>
        `;
        container.appendChild(card);
      });
    }

    function createServer() {
      playClickSound();
      const name = document.getElementById('inputServerName').value || 'Graffiti Room';
      isPrivateServer = document.querySelector('input[name="serverType"]:checked').value === 'private';
      const maxPlayers = parseInt(document.getElementById('inputMaxPlayers').value) || 4;
      hostRoomCode = document.getElementById('inputRoomCode').value.trim() || '';

      if (isPrivateServer && !hostRoomCode) {
        alert('Please enter a join code for private rooms.');
        return;
      }

      closeCreateServerModal();
      document.getElementById('serverBrowserScreen').classList.remove('active');

      gameMode = 'host';
      document.getElementById('leaveBtn').style.display = 'inline-block';
      document.getElementById('badgeText').innerText = `${name} (1/${maxPlayers})`;
      document.getElementById('connectionBadge').classList.add('active');
      resize();

      peer = new Peer();
      peer.on('open', (peerId) => {
        const serverInfo = {
          id: peerId,
          name: name,
          isPrivate: isPrivateServer,
          maxPlayers: maxPlayers,
          players: 1
        };

        if (mqttClient && mqttClient.connected) {
          mqttClient.publish(MQTT_TOPIC_DISCOVERY, JSON.stringify(serverInfo));
          setInterval(() => {
            if (gameMode === 'host' && mqttClient && mqttClient.connected) {
              mqttClient.publish(MQTT_TOPIC_DISCOVERY, JSON.stringify(serverInfo));
            }
          }, 4000);
        }
      });

      peer.on('connection', (conn) => {
        if (clientConnections.length >= maxPlayers - 1) {
          conn.on('open', () => {
            conn.send({ type: 'REJECT', reason: 'Server is full' });
            setTimeout(() => conn.close(), 500);
          });
          return;
        }

        conn.on('open', () => {
          // Wait for JOIN message with code validation before adding to client list
        });

        conn.on('data', (data) => {
          handleNetworkData(data, conn);
        });

        conn.on('close', () => {
          clientConnections = clientConnections.filter(c => c !== conn);
          updateHostPlayerBadge();
        });
      });
    }

    function updateHostPlayerBadge() {
      const name = document.getElementById('inputServerName').value || 'Graffiti Room';
      const maxPlayers = parseInt(document.getElementById('inputMaxPlayers').value) || 4;
      const count = clientConnections.length + 1;
      document.getElementById('badgeText').innerText = `${name} (${count}/${maxPlayers})`;
    }

    function tryJoinServer(serverId) {
      playClickSound();
      const server = discoveredServers[serverId];
      if (!server) return;

      selectedServerToJoin = server;
      if (server.isPrivate) {
        document.getElementById('inputJoinCode').value = '';
        document.getElementById('passwordModal').classList.add('active');
      } else {
        connectToServer(server.id, '');
      }
    }

    function closePasswordModal() {
      playClickSound();
      document.getElementById('passwordModal').classList.remove('active');
      selectedServerToJoin = null;
    }

    function submitRoomCode() {
      playClickSound();
      const enteredCode = document.getElementById('inputJoinCode').value.trim();
      if (!selectedServerToJoin) return;
      closePasswordModal();
      connectToServer(selectedServerToJoin.id, enteredCode);
    }

    function connectToServer(hostPeerId, code) {
      document.getElementById('serverBrowserScreen').classList.remove('active');
      gameMode = 'client';
      document.getElementById('leaveBtn').style.display = 'inline-block';
      document.getElementById('badgeText').innerText = `Connecting to host...`;
      document.getElementById('connectionBadge').classList.add('active');
      resize();

      peer = new Peer();
      peer.on('open', () => {
        hostConnection = peer.connect(hostPeerId, { reliable: true });

        hostConnection.on('open', () => {
          hostConnection.send({ type: 'JOIN', code: code });
        });

        hostConnection.on('data', (data) => {
          handleNetworkData(data, hostConnection);
        });

        hostConnection.on('close', () => {
          alert('Disconnected from server.');
          leaveGame();
        });

        hostConnection.on('error', (err) => {
          alert('Could not connect to host.');
          leaveGame();
        });
      });
    }

    // --- NETWORK DATA SYNC ---
    function handleNetworkData(data, conn) {
      if (data.type === 'JOIN') {
        if (gameMode === 'host') {
          // Validate code if private
          if (isPrivateServer) {
            const cleanEntered = String(data.code || '').trim().toLowerCase();
            const cleanHost = String(hostRoomCode || '').trim().toLowerCase();
            if (cleanEntered !== cleanHost) {
              conn.send({ type: 'REJECT', reason: 'Incorrect room code!' });
              setTimeout(() => conn.close(), 500);
              return;
            }
          }

          if (!clientConnections.includes(conn)) {
            clientConnections.push(conn);
            updateHostPlayerBadge();
          }

          conn.send({ type: 'WELCOME' });

          // Send compressed/scaled-down canvas state to avoid WebRTC data limit crashes
          const tempC = document.createElement('canvas');
          tempC.width = Math.floor(width / 2);
          tempC.height = Math.floor(height / 2);
          const tCtx = tempC.getContext('2d');
          tCtx.drawImage(wallCanvas, 0, 0, tempC.width, tempC.height);
          const currentArt = tempC.toDataURL('image/jpeg', 0.6);

          conn.send({ type: 'LOAD_CANVAS', dataURL: currentArt });
        }
      } else if (data.type === 'WELCOME') {
        document.getElementById('badgeText').innerText = `Connected to Room`;
      } else if (data.type === 'LOAD_CANVAS') {
        const img = new Image();
        img.onload = () => {
          wallCtx.save();
          wallCtx.clearRect(0, 0, width, height);
          wallCtx.drawImage(img, 0, 0, width, height);
          wallCtx.restore();
        };
        img.src = data.dataURL;
      } else if (data.type === 'SPRAY') {
        sprayAtDirect(data.x, data.y, data.rgb, data.radius);
        if (gameMode === 'host') {
          clientConnections.forEach(c => { if (c !== conn && c.open) c.send(data); });
        }
      } else if (data.type === 'ERASE') {
        eraseAtDirect(data.x, data.y);
        if (gameMode === 'host') {
          clientConnections.forEach(c => { if (c !== conn && c.open) c.send(data); });
        }
      } else if (data.type === 'CLEAR') {
        wallCtx.clearRect(0, 0, width, height);
        drips = [];
        if (gameMode === 'host') {
          clientConnections.forEach(c => { if (c !== conn && c.open) c.send(data); });
        }
      } else if (data.type === 'REJECT') {
        alert(data.reason || 'Could not join server.');
        leaveGame();
      }
    }

    function sendNetworkAction(actionData) {
      if (gameMode === 'host') {
        clientConnections.forEach(c => {
          if (c && c.open) c.send(actionData);
        });
      } else if (gameMode === 'client' && hostConnection && hostConnection.open) {
        hostConnection.send(actionData);
      }
    }

    // --- INPUT HANDLING ---
    function updateCoords(e) {
      lastX = mouseX;
      lastY = mouseY;
      if (e.touches && e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      } else {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }
      const dist = Math.hypot(mouseX - lastX, mouseY - lastY);
      if (dist > 18) { playShakeSound(); }
    }

    function isUiTarget(e) {
      return e.target.closest('#uiBar') || e.target.closest('#showUiBtn') || e.target.closest('.modal-overlay');
    }

    window.addEventListener('mousedown', (e) => {
      if (isUiTarget(e) || document.querySelector('.screen.active') || document.querySelector('.modal-overlay.active')) return;
      isSpraying = true;
      updateCoords(e);
      lastSprayX = mouseX;
      lastSprayY = mouseY;
      startSpraySound();
    });

    window.addEventListener('mousemove', updateCoords);
    window.addEventListener('mouseup', () => { isSpraying = false; stopSpraySound(); });
    window.addEventListener('mouseleave', () => { isSpraying = false; stopSpraySound(); });

    window.addEventListener('touchstart', (e) => {
      if (isUiTarget(e) || document.querySelector('.screen.active') || document.querySelector('.modal-overlay.active')) return;
      isSpraying = true;
      updateCoords(e);
      lastSprayX = mouseX;
      lastSprayY = mouseY;
      startSpraySound();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isSpraying) { e.preventDefault(); updateCoords(e); }
    }, { passive: false });

    window.addEventListener('touchend', () => { isSpraying = false; stopSpraySound(); });
    window.addEventListener('touchcancel', () => { isSpraying = false; stopSpraySound(); });

    window.addEventListener('keydown', (e) => {

    function hexToRgb(hex) {

      if (hex.length === 3) { hex = hex.split('').map(c => c + c).join(''); }
      const num = parseInt(hex, 16);
      return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    // --- SPRAY & ERASE DRAWING LOGIC ---
    function sprayAt(x, y) {
      sprayAtDirect(x, y, currentColorRGB, sprayRadius);
      sendNetworkAction({ type: 'SPRAY', x: x, y: y, rgb: currentColorRGB, radius: sprayRadius });
    }

    function sprayAtDirect(x, y, rgb, radius) {
      wallCtx.save();
      wallCtx.globalCompositeOperation = 'source-over';
      const density = Math.floor(radius * 2.5);
      for (let i = 0; i < density; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * radius;
        const dotX = x + Math.cos(angle) * r;
        const dotY = y + Math.sin(angle) * r;
        const alpha = (1 - r / radius) * 0.85;

        wallCtx.fillStyle = `rgba(${rgb}, ${alpha})`;
        wallCtx.beginPath();
        wallCtx.arc(dotX, dotY, Math.random() * 2.2 + 0.8, 0, Math.PI * 2);
        wallCtx.fill();
      }

      if (Math.random() < 0.18) {
        drips.push({
          x: x + (Math.random() - 0.5) * 12,
          y: y,
          speed: Math.random() * 0.6 + 0.3,
          length: 0,
          maxLength: Math.random() * 80 + 15,
          width: Math.random() * 2.4 + 1.2,
          rgb: rgb,
          alpha: 0.95
        });
      }
      wallCtx.restore();
    }

    function eraseAt(x, y) {
      eraseAtDirect(x, y);
      sendNetworkAction({ type: 'ERASE', x: x, y: y });
    }

    function eraseAtDirect(x, y) {
      wallCtx.save();
      wallCtx.globalCompositeOperation = 'destination-out';
      wallCtx.beginPath();
      wallCtx.arc(x, y, ERASER_RADIUS, 0, Math.PI * 2);
      wallCtx.fill();
      wallCtx.restore();
    }

    function renderDrips() {
      wallCtx.save();
      wallCtx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < drips.length; i++) {
        const d = drips[i];
        if (d.length < d.maxLength) {
          d.length += d.speed;
          d.y += d.speed;
          wallCtx.fillStyle = `rgba(${d.rgb}, ${d.alpha})`;
          wallCtx.beginPath();
          wallCtx.arc(d.x, d.y, d.width, 0, Math.PI * 2);
          wallCtx.fill();
        }
      }
      wallCtx.restore();
    }

    // --- RENDER TOOLS & CURSORS ---
    function drawSprayCan(x, y, shake, spraying) {
      canCtx.save();
      canCtx.translate(x, y);
      canCtx.rotate(shake);
      if (spraying) {
        const gradient = canCtx.createRadialGradient(-30, -75, 4, -30, -75, 45);
        gradient.addColorStop(0, `rgba(${currentColorRGB}, 0.85)`);
        gradient.addColorStop(0.4, `rgba(${currentColorRGB}, 0.25)`);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        canCtx.fillStyle = gradient;
        canCtx.beginPath();
        canCtx.arc(-30, -75, 45, 0, Math.PI * 2);
        canCtx.fill();
      }
      canCtx.fillStyle = '#e0e0e0'; canCtx.fillRect(-8, -75, 16, 12);
      canCtx.fillStyle = '#0a0a0a'; canCtx.fillRect(-10, -70, 4, 4);
      canCtx.fillStyle = '#4f4f4f';
      canCtx.beginPath(); canCtx.moveTo(-25, -45); canCtx.quadraticCurveTo(0, -68, 25, -45); canCtx.fill();
      
      const bodyGrad = canCtx.createLinearGradient(-30, 0, 30, 0);
      bodyGrad.addColorStop(0, '#111'); bodyGrad.addColorStop(0.3, '#333'); bodyGrad.addColorStop(0.7, '#222'); bodyGrad.addColorStop(1, '#080808');
      canCtx.fillStyle = bodyGrad; canCtx.fillRect(-28, -45, 56, 130);
      canCtx.fillStyle = '#0f0f0f'; canCtx.fillRect(-28, -25, 56, 70);
      canCtx.fillStyle = currentColorHex; canCtx.font = 'bold 12px monospace'; canCtx.textAlign = 'center';
      canCtx.fillText('KRYLON', 0, 0); canCtx.fillText('SPRAY', 0, 18);
      canCtx.fillStyle = '#5a5a5a'; canCtx.fillRect(-28, 83, 56, 6);
      canCtx.restore();
    }

    function drawEraserCursor(x, y, active) {
      canCtx.save();
      canCtx.translate(x, y);
      canCtx.strokeStyle = active ? '#ff6b81' : '#ffffff';
      canCtx.lineWidth = 2; canCtx.setLineDash([6, 4]);
      canCtx.beginPath(); canCtx.arc(0, 0, ERASER_RADIUS, 0, Math.PI * 2); canCtx.stroke();
      if (active) {
        canCtx.fillStyle = 'rgba(255, 107, 129, 0.25)';
        canCtx.beginPath(); canCtx.arc(0, 0, ERASER_RADIUS, 0, Math.PI * 2); canCtx.fill();
      }
      canCtx.translate(ERASER_RADIUS - 8, ERASER_RADIUS - 8);
      canCtx.rotate(-0.3);
      canCtx.fillStyle = '#ff6b81'; canCtx.fillRect(-12, -8, 24, 16);
      canCtx.fillStyle = '#fff'; canCtx.fillRect(-12, -8, 8, 16);
      canCtx.strokeStyle = '#222'; canCtx.lineWidth = 1; canCtx.strokeRect(-12, -8, 24, 16);
      canCtx.restore();
    }

    // --- ANIMATION / GAME LOOP ---
    function animate() {
      canCtx.clearRect(0, 0, width, height);
      renderDrips();

      const isMenuActive = document.querySelector('.screen.active') || document.querySelector('.modal-overlay.active');

      if (!isMenuActive) {
        if (currentTool === 'spray') {
          if (isSpraying) {
            const dist = Math.hypot(mouseX - lastSprayX, mouseY - lastSprayY);
            const steps = Math.max(1, Math.floor(dist / 4));
            for (let i = 0; i <= steps; i++) {
              const interpX = lastSprayX + (mouseX - lastSprayX) * (i / steps);
              const interpY = lastSprayY + (mouseY - lastSprayY) * (i / steps);
              sprayAt(interpX, interpY);
            }
            lastSprayX = mouseX;
            lastSprayY = mouseY;
            shakeAngle = (Math.random() - 0.5) * 0.08;
          } else {
            lastSprayX = mouseX;
            lastSprayY = mouseY;
            shakeAngle = 0;
          }
          drawSprayCan(mouseX + 30, mouseY + 75, shakeAngle, isSpraying);
        } else if (currentTool === 'eraser') {
          if (isSpraying) {
            const dist = Math.hypot(mouseX - lastSprayX, mouseY - lastSprayY);
            const steps = Math.max(1, Math.floor(dist / 4));
            for (let i = 0; i <= steps; i++) {
              const interpX = lastSprayX + (mouseX - lastSprayX) * (i / steps);
              const interpY = lastSprayY + (mouseY - lastSprayY) * (i / steps);
              eraseAt(interpX, interpY);
            }
            lastSprayX = mouseX;
            lastSprayY = mouseY;
          } else {
            lastSprayX = mouseX;
            lastSprayY = mouseY;
          }
          drawEraserCursor(mouseX, mouseY, isSpraying);
        }
      }

      requestAnimationFrame(animate);
    }

    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
